name: Deploy

# Every push to main: run CI, build the Docker image, push it to GHCR, deploy it to the demo VPS.
# Needs repo secrets DEPLOY_SSH_KEY + DEPLOY_KNOWN_HOSTS and repo variable DEPLOY_HOST (see DEPLOY.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://gauge.gounmanual.com
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Copy deploy files
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ vars.DEPLOY_HOST }} 'mkdir -p /opt/gauge-room'
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/gauge-room.caddy deploy/server-deploy.sh \
            root@${{ vars.DEPLOY_HOST }}:/opt/gauge-room/
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ vars.DEPLOY_HOST }} \
            "GAUGE_IMAGE='${{ env.IMAGE }}:${{ github.sha }}' GHCR_USER='${{ github.actor }}' bash /opt/gauge-room/server-deploy.sh" \
            <<< "${{ secrets.GITHUB_TOKEN }}"
